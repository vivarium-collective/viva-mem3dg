name: membrane-patch
description: "Membrane patch bulging: a flat hexagonal membrane with fixed boundary edges is inflated by constant osmotic pressure, forming a dome. Models local membrane deformation such as bleb formation or pressure-driven bulging in confined geometries."
tags: [mem3dg, membranes, patch, bulging, hexagon, demo, visualization]

requires:
  processes: [Mem3DGProcess, MembranePlots, Membrane3D, RAMEmitter]

parameters:
  interval:
    type: float
    default: 5.0
    description: "Process interval in Mem3DG time units. Demo runs use 40 (total_time=1000 / n_snapshots=25); the lower default keeps dashboard test-runs fast."
  mesh_type:
    type: string
    default: "hexagon"
    description: "Initial mesh shape."
  radius:
    type: float
    default: 1.0
    description: "Mesh radius."
  subdivision:
    type: int
    default: 4
    description: "Hexagon subdivision level."
  Kbc:
    type: float
    default: 3.0e-4
    description: "Bending rigidity coefficient."
  tension_modulus:
    type: float
    default: 0.01
    description: "Surface tension modulus."
  preferred_area_scale:
    type: float
    default: 1.2
    description: "Preferred-area scale (>1 favors area expansion)."
  osmotic_model:
    type: string
    default: "constant"
    description: "Osmotic model — 'constant' applies a fixed baseline pressure."
  osmotic_pressure:
    type: float
    default: 0.08
    description: "Constant osmotic pressure (used when osmotic_model = constant)."
  boundary_condition:
    type: string
    default: "fixed"
    description: "Boundary condition — 'fixed' pins boundary vertices in place."
  characteristic_timestep:
    type: float
    default: 0.5
    description: "Euler integrator base timestep."
  tolerance:
    type: float
    default: 1.0e-14
    description: "Convergence tolerance."
  viz_title:
    type: string
    default: "Patch — energy + geometry"
  viz_3d_title:
    type: string
    default: "Patch mesh"

state:
  membrane:
    _type: process
    address: "local:Mem3DGProcess"
    config:
      mesh_type: "${mesh_type}"
      radius: "${radius}"
      subdivision: "${subdivision}"
      Kbc: "${Kbc}"
      tension_modulus: "${tension_modulus}"
      preferred_area_scale: "${preferred_area_scale}"
      osmotic_model: "${osmotic_model}"
      osmotic_pressure: "${osmotic_pressure}"
      boundary_condition: "${boundary_condition}"
      characteristic_timestep: "${characteristic_timestep}"
      tolerance: "${tolerance}"
    inputs: {}
    outputs:
      total_energy: ["stores", "total_energy"]
      bending_energy: ["stores", "bending_energy"]
      surface_energy: ["stores", "surface_energy"]
      pressure_energy: ["stores", "pressure_energy"]
      surface_area: ["stores", "surface_area"]
      volume: ["stores", "volume"]
      vertex_positions: ["stores", "vertex_positions"]
      faces: ["stores", "faces"]
      mean_curvatures: ["stores", "mean_curvatures"]
      converged: ["stores", "converged"]
    interval: "${interval}"
  stores:
    total_energy: 0.0
    bending_energy: 0.0
    surface_energy: 0.0
    pressure_energy: 0.0
    surface_area: 0.0
    volume: 0.0
    vertex_positions: []
    faces: []
    mean_curvatures: []
    converged: false
    viz_html: ""
    viz_3d_html: ""
  viz:
    _type: step
    address: "local:MembranePlots"
    config:
      title: "${viz_title}"
    inputs:
      total_energy: ["stores", "total_energy"]
      bending_energy: ["stores", "bending_energy"]
      surface_energy: ["stores", "surface_energy"]
      pressure_energy: ["stores", "pressure_energy"]
      surface_area: ["stores", "surface_area"]
      volume: ["stores", "volume"]
      time: ["global_time"]
    outputs:
      html: ["stores", "viz_html"]
  viz_membrane_3d:
    _type: step
    address: "local:Membrane3D"
    config:
      title: "${viz_3d_title}"
      wireframe: false
    inputs:
      vertices: ["stores", "vertex_positions"]
      faces: ["stores", "faces"]
    outputs:
      html: ["stores", "viz_3d_html"]
  emitter:
    _type: step
    address: "local:RAMEmitter"
    config:
      emit:
        total_energy: "float"
        bending_energy: "float"
        surface_energy: "float"
        pressure_energy: "float"
        surface_area: "float"
        volume: "float"
    inputs:
      total_energy: ["stores", "total_energy"]
      bending_energy: ["stores", "bending_energy"]
      surface_energy: ["stores", "surface_energy"]
      pressure_energy: ["stores", "pressure_energy"]
      surface_area: ["stores", "surface_area"]
      volume: ["stores", "volume"]
