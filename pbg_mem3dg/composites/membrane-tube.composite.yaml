name: membrane-tube
description: "Tubular constriction: a cylindrical tube narrows uniformly as osmotic pressure drives volume reduction to 60% of its initial value. Pinned boundary conditions hold the ends. Models membrane tubule dynamics in endoplasmic reticulum networks."
tags: [mem3dg, membranes, tube, constriction, cylinder, demo, visualization]

requires:
  processes: [Mem3DGProcess, MembranePlots, Membrane3D, RAMEmitter]

parameters:
  interval:
    type: float
    default: 5.0
    description: "Process interval in Mem3DG time units. Demo runs use 60 (total_time=1500 / n_snapshots=25); the lower default keeps dashboard test-runs fast."
  mesh_type:
    type: string
    default: "cylinder"
    description: "Initial mesh shape."
  radius:
    type: float
    default: 0.5
    description: "Tube radius."
  subdivision:
    type: int
    default: 20
    description: "Azimuthal subdivision (vertices around the tube)."
  axial_subdivision:
    type: int
    default: 30
    description: "Axial subdivision (vertices along the tube)."
  Kbc:
    type: float
    default: 5.0e-4
    description: "Bending rigidity coefficient."
  tension_modulus:
    type: float
    default: 0.05
    description: "Surface tension modulus."
  preferred_area_scale:
    type: float
    default: 0.8
    description: "Preferred-area scale (<1 favors area contraction)."
  osmotic_strength:
    type: float
    default: 0.08
    description: "Osmotic pressure strength."
  preferred_volume_fraction:
    type: float
    default: 0.6
    description: "Target volume as a fraction of initial volume (0.6 = 60%)."
  boundary_condition:
    type: string
    default: "pin"
    description: "Boundary condition — 'pin' fixes the tube end caps."
  characteristic_timestep:
    type: float
    default: 0.5
    description: "Euler integrator base timestep."
  tolerance:
    type: float
    default: 1.0e-14
    description: "Convergence tolerance."
  viz_title:
    type: string
    default: "Tube — energy + geometry"
  viz_3d_title:
    type: string
    default: "Tube mesh"

state:
  membrane:
    _type: process
    address: "local:Mem3DGProcess"
    config:
      mesh_type: "${mesh_type}"
      radius: "${radius}"
      subdivision: "${subdivision}"
      axial_subdivision: "${axial_subdivision}"
      Kbc: "${Kbc}"
      tension_modulus: "${tension_modulus}"
      preferred_area_scale: "${preferred_area_scale}"
      osmotic_strength: "${osmotic_strength}"
      preferred_volume_fraction: "${preferred_volume_fraction}"
      boundary_condition: "${boundary_condition}"
      characteristic_timestep: "${characteristic_timestep}"
      tolerance: "${tolerance}"
    inputs: {}
    outputs:
      total_energy: ["stores", "total_energy"]
      bending_energy: ["stores", "bending_energy"]
      surface_energy: ["stores", "surface_energy"]
      pressure_energy: ["stores", "pressure_energy"]
      surface_area: ["stores", "surface_area"]
      volume: ["stores", "volume"]
      vertex_positions: ["stores", "vertex_positions"]
      faces: ["stores", "faces"]
      mean_curvatures: ["stores", "mean_curvatures"]
      converged: ["stores", "converged"]
    interval: "${interval}"
  stores:
    total_energy: 0.0
    bending_energy: 0.0
    surface_energy: 0.0
    pressure_energy: 0.0
    surface_area: 0.0
    volume: 0.0
    vertex_positions: []
    faces: []
    mean_curvatures: []
    converged: false
    viz_html: ""
    viz_3d_html: ""
  viz:
    _type: step
    address: "local:MembranePlots"
    config:
      title: "${viz_title}"
    inputs:
      total_energy: ["stores", "total_energy"]
      bending_energy: ["stores", "bending_energy"]
      surface_energy: ["stores", "surface_energy"]
      pressure_energy: ["stores", "pressure_energy"]
      surface_area: ["stores", "surface_area"]
      volume: ["stores", "volume"]
      time: ["global_time"]
    outputs:
      html: ["stores", "viz_html"]
  viz_membrane_3d:
    _type: step
    address: "local:Membrane3D"
    config:
      title: "${viz_3d_title}"
      wireframe: false
    inputs:
      vertices: ["stores", "vertex_positions"]
      faces: ["stores", "faces"]
    outputs:
      html: ["stores", "viz_3d_html"]
  emitter:
    _type: step
    address: "local:RAMEmitter"
    config:
      emit:
        total_energy: "float"
        bending_energy: "float"
        surface_energy: "float"
        pressure_energy: "float"
        surface_area: "float"
        volume: "float"
    inputs:
      total_energy: ["stores", "total_energy"]
      bending_energy: ["stores", "bending_energy"]
      surface_energy: ["stores", "surface_energy"]
      pressure_energy: ["stores", "pressure_energy"]
      surface_area: ["stores", "surface_area"]
      volume: ["stores", "volume"]
